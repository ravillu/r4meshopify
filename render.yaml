services:
  - type: web
    name: route4me-dashboard
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.9
      - key: ROUTE4ME_API_KEY
        sync: false
      - key: FLASK_SECRET_KEY
        generateValue: true 